name: teenypdf
description: TeenyPDF - PDF tools app built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Functional error handling (Either)
  dartz: ^0.10.1

  # Dependency injection
  get_it: ^8.0.3

  # Navigation
  go_router: ^15.1.2

  # Networking
  dio: ^5.8.0+1
  connectivity_plus: ^6.1.4

  # Local storage
  shared_preferences: ^2.5.3

  # Utilities
  logger: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
